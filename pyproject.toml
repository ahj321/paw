[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paw-control"
version = "2.3.2"
description = "A pair of hands for your agent: screenshot, click, type. One command, one thing. A tiny CLI + MCP server for vision models."
readme = "README.pypi.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ahj321" }]
keywords = ["agent", "mcp", "automation", "screenshot", "click", "gui-automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["pillow"]

[project.optional-dependencies]
windows = ["pyvda"]
mcp = ["mcp[cli]"]

[project.scripts]
paw = "paw:main"

[project.urls]
Homepage = "https://github.com/ahj321/paw"
Source = "https://github.com/ahj321/paw"
Changelog = "https://github.com/ahj321/paw/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["paw"]
