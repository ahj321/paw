[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paw-control"
version = "1.3.0"
description = "进一步提升 AI 的手：看屏幕、点按钮、打字，一条命令做一件事。A tiny CLI + MCP server that gives vision models and agents real hands."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ahj321" }]
keywords = ["agent", "mcp", "automation", "screenshot", "click", "gui-automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Win32 (MS Windows)",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = ["pillow"]

[project.optional-dependencies]
windows = ["pyvda"]
mcp = ["mcp[cli]"]

[project.scripts]
paw = "paw:main"

[project.urls]
Homepage = "https://github.com/ahj321/paw"
Source = "https://github.com/ahj321/paw"
Changelog = "https://github.com/ahj321/paw/blob/main/CHANGELOG.md"

[tool.setuptools]
py-modules = ["paw"]
